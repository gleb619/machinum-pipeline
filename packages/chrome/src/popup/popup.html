<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mt Pipeline</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 320px;
        padding: 16px;
        background: #1a1a2e;
        color: #eee;
      }
      h1 {
        font-size: 16px;
        margin-bottom: 16px;
        color: #fff;
      }
      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
        color: #aaa;
      }
      input {
        width: 100%;
        padding: 8px;
        margin-bottom: 12px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #16213e;
        color: #fff;
        font-size: 13px;
      }
      button {
        width: 100%;
        padding: 10px;
        background: #0f3460;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        margin-bottom: 12px;
      }
      button:hover {
        background: #16537e;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        font-size: 12px;
        color: #aaa;
        min-height: 40px;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h1>Mt Pipeline</h1>
    <label for="backendUrl">Backend URL</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:7777" />
    <label for="runId">Run ID</label>
    <input type="text" id="runId" placeholder="Run ID" />
    <button id="scrapeBtn">Scrape Page</button>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
