name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    # `pnpm test` = workspace unit tests + root vitest + sample integration tests.
    # GPU tests (packages/tools/tests/it, real ollama) live behind `pnpm test:gpu`
    # (vitest.gpu.config.ts) and are never part of `pnpm test`, so CI needs no GPU.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: pnpm test

  skill-drift:
    # docs/SKILL.md is the source of truth for the copy embedded in the binary.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node packages/cli/scripts/gen-skill.mjs --check

  binary:
    # Builds the Bun single-file binary and runs the 15-step offline smoke test against it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          bun: 'true'
      - run: pnpm smoke:bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mt-linux-x64
          path: packages/mt/dist/bin/mt
          retention-days: 3
          if-no-files-found: error

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck (ubuntu-latest ships shellcheck)
        run: shellcheck -s sh docs/install.sh && shellcheck -s sh docker/entrypoint.sh

  docker:
    # Lint + build (no push) of the Dockerfile from the binary built in the `binary` job.
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: hadolint
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mt-linux-x64
          path: packages/mt/dist/bin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: mt:ci
          build-args: |
            MT_SOURCE=local
            MT_VERSION=ci
      - name: smoke the image (--help, first-run master key on a fresh volume)
        run: |
          docker run --rm mt:ci --version
          docker volume create mt-ci-home
          docker run --rm -v mt-ci-home:/home/mt/.mt mt:ci vault list
          docker run --rm -v mt-ci-home:/home/mt/.mt mt:ci vault master-key status | grep -q 'source: user'
