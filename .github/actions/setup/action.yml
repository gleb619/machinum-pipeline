name: Setup workspace
description: Node 22 + pnpm (via corepack, version from packageManager) + optional Bun, then pnpm install.
inputs:
  bun:
    description: Install Bun (needed to compile the mt binary)
    default: 'false'
  install:
    description: Run pnpm install
    default: 'true'
runs:
  using: composite
  steps:
    - name: Enable corepack (pnpm version from packageManager)
      shell: bash
      run: corepack enable
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22
        cache: pnpm
    - if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14
    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
